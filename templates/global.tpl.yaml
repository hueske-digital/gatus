metrics: {{ getenv "METRICS" | default "false" }}

storage:
  type: "{{ getenv "STORAGE_TYPE" | default "postgres" }}"
  path: "{{ (printf "postgres://%s:%s@database:5432/%s?sslmode=disable" (getenv "POSTGRES_USER") (getenv "POSTGRES_PASSWORD") (getenv "POSTGRES_DB")) }}"

alerting:
  custom:
    url: https://api.pushover.net/1/messages.json
    method: "POST"
    headers:
      Content-Type: "application/json"
    body: |
      {
        "token": "{{ getenv "PUSHOVER_APP_TOKEN" }}",
        "user": "{{ getenv "PUSHOVER_USER_KEY" }}",
        "device": "{{ getenv "PUSHOVER_DEVICES" }}",
        "title": "[ALERT_TRIGGERED_OR_RESOLVED] [ENDPOINT_NAME]",
        "message": "[ALERT_TRIGGERED_OR_RESOLVED] alert for <b>[ENDPOINT_NAME]</b> in group <b>[ENDPOINT_GROUP]</b>: [ALERT_DESCRIPTION]\n[RESULT_ERRORS]",
        "html": 1
      }
    default-alert:
      enabled: true
      send-on-resolved: true
      failure-threshold: 5
      success-threshold: 2
    placeholders:
      ALERT_TRIGGERED_OR_RESOLVED:
        TRIGGERED: "🔥"
        RESOLVED: "🤩"

security:
  basic:
    username: "{{ getenv "BASIC_AUTH_USERNAME" | default "admin" }}"
    password-bcrypt-base64: "{{ (getenv "BASIC_AUTH_PASSWORD" | default "admin") | crypto.Bcrypt 10 | base64.Encode }}"

disable-monitoring-lock: {{ getenv "DISABLE_MONITORING_LOCK" | default "true" }}

ui:
  header: "{{ getenv "UI_HEADER" | default "Monitoring Dashboard" }}"
  title: "{{ getenv "UI_TITLE" | default "Monitoring Dashboard | hueske.digital" }}"
  logo: "{{ getenv "UI_LOGO" | default "https://hueske.digital/wp-content/themes/hd-website/img/favicon/android-chrome-512x512.png" }}"
  dark-mode: {{ getenv "UI_DARK_MODE" | default "false" }}
  badge:
    response-time:
      thresholds: [200, 300, 400, 500, 600]

connectivity:
  checker:
    target: "{{ getenv "CONNECTIVITY_TARGET" | default "8.8.8.8:53" }}"
    interval: "{{ getenv "CONNECTIVITY_INTERVAL" | default "30s" }}"